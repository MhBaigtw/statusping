# Render Blueprint for hosting option (c) in docs/deploy.md (D31): ONE free web service that also
# runs the job worker + scheduler as threads inside its single gunicorn process
# (EMBEDDED_WORKER=true, see gunicorn.conf.py). Postgres is Supabase Free (DATABASE_URL, D30).
#
# MONITORING ONLY RUNS WHILE THIS INSTANCE IS AWAKE. Render spins a free web service down after
# 15 minutes without inbound HTTP traffic, and there is deliberately no keep-alive pinger (free hours
# shared with FixFlow, Render AUP). For 24/7 monitoring add a Starter `type: worker` service running
# `python manage.py run_worker --threads 4` and remove EMBEDDED_WORKER (docs/deploy.md, option (c)).
services:
  - type: web
    name: statusping
    runtime: python
    plan: free
    region: oregon                  # same region as the Supabase project (West US, Oregon)
    buildCommand: bash bin/render-build.sh
    startCommand: gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /api/health/live/   # web-only; /api/health/ is 503 when the worker is dead
    autoDeployTrigger: checksPass   # deploy only after GitHub CI passes
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: NUM_PROXIES            # starting value from FixFlow; MEASURE it live (deploy.md s.4)
        value: "3"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: EMBEDDED_WORKER        # job threads + scheduler inside the web process (forces 1 gunicorn process)
        value: "true"
      - key: WORKER_THREADS
        value: "2"
      - key: WORKER_POLL_SECONDS    # idle poll every 3 s, not 1 s: ~1.1 GB/month of Supabase's 5 GB egress (D31)
        value: "3"
      - key: DATABASE_URL           # Supabase SESSION pooler (:5432, IPv4); sslmode=require forced by prod.py
        sync: false
      - key: DEMO_PASSWORD          # optional; seeds demo users at build time
        sync: false
