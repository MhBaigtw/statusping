# DRAFT Render Blueprint for hosting option (a) in docs/deploy.md:
#   web (free) + background worker (Starter, paid) + Supabase Free Postgres (DATABASE_URL, D30).
# Not applied anywhere yet: Humayun chooses the option first. For option (c) delete the
# worker service and add EMBEDDED_WORKER=true to the web service instead.
envVarGroups:
  - name: statusping-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY             # one value shared by web and worker
        generateValue: true
      - key: NUM_PROXIES            # starting value from FixFlow; MEASURE it live (deploy.md s.4)
        value: "3"
      - key: DB_CONN_MAX_AGE
        value: "60"

services:
  - type: web
    name: statusping
    runtime: python
    plan: free                      # sleeps after 15 min idle; the WORKER keeps monitoring
    region: oregon                  # keep the database in the same region
    buildCommand: bash bin/render-build.sh
    startCommand: gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /api/health/live/   # web-only; /api/health/ is 503 when the worker is dead
    autoDeployTrigger: checksPass   # deploy only after GitHub CI passes
    envVars:
      - fromGroup: statusping-shared
      - key: DATABASE_URL           # Supabase SESSION pooler (:5432, IPv4); sslmode=require forced by prod.py
        sync: false
      - key: DEMO_PASSWORD          # optional; seeds demo users at build time
        sync: false

  - type: worker
    name: statusping-worker
    runtime: python
    plan: starter                   # Render has no free plan for background workers
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_worker --threads 4
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: statusping-shared
      - key: DATABASE_URL
        sync: false
